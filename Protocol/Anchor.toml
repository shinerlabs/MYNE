[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
myne_protocol = "D6kkupmJWw9bpDZ46R8Xn1ncMtC1upopPo2wundvWd3e"

[programs.devnet]
myne_protocol = "D6kkupmJWw9bpDZ46R8Xn1ncMtC1upopPo2wundvWd3e"

[programs.mainnet]
myne_protocol = "D6kkupmJWw9bpDZ46R8Xn1ncMtC1upopPo2wundvWd3e"

[provider]
cluster = "Localnet"
wallet = ".localnet/test-wallet.json"

[scripts]
test = "pnpm run test:local"

[test]
upgradeable = true

[test.validator]
# Keep automated integration tests isolated from the long-running local viewer
# validator, which uses Solana's default RPC port (8899).
rpc_port = 18999
