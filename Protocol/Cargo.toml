[workspace]
members = ["programs/*"]
resolver = "2"

# Solana's SDK is split across crates with different package versions, so the
# verified-build CLI cannot safely infer the intended Agave toolchain from the
# first matching Cargo.lock entry. Pin the exact production CLI explicitly.
[workspace.metadata.cli]
solana = "3.1.10"

[workspace.dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }

[workspace.lints.clippy]
# Emitted inside Anchor 1.0.2's generated entrypoint when checked by Rust 1.97.
diverging_sub_expression = "allow"
