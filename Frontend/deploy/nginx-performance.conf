# Include these directives in the gld.money server block. Vite hashes JS/CSS/font filenames,
# so those assets can be cached permanently. HTML stays revalidated so new deployments appear.

gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

# Enable when nginx has ngx_brotli installed. The build emits matching .br files.
# brotli_static on;

location = /index.html {
  add_header Cache-Control "no-cache, must-revalidate" always;
  try_files $uri =404;
}

location ^~ /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  expires 1y;
  try_files $uri =404;
}

location ~* \.(?:png|webp|gif|ico|svg)$ {
  add_header Cache-Control "public, max-age=2592000" always;
  expires 30d;
  try_files $uri =404;
}

location / {
  try_files $uri $uri/ /index.html;
}
